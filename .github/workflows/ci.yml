name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: jobs ask for what they need.
permissions: {}

jobs:
  go:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # threat check --base needs history
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # no shared cache between PRs and main
      - name: Format
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Fuzz (short)
        run: |
          go test ./internal/model -run '^$' -fuzz FuzzParse -fuzztime 30s
          go test ./internal/edit -run '^$' -fuzz FuzzUpsert -fuzztime 30s
      - name: Check our own threat model
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE" ]; then
            go run ./cmd/threat check --base "$BASE"
          else
            go run ./cmd/threat check
          fi

  web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Build WASM core
        run: make wasm
      - name: Install, typecheck and build
        working-directory: web
        run: |
          npm ci --ignore-scripts
          npm run typecheck
          npm run build
